# libsys

version: "3.8"

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: libsys
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d libsys"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - libsys

  migrator:
    build:
      context: .
      dockerfile: ./migrations/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: libsys
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - libsys
    restart: "no"

  books-service:
    build:
      context: .
      dockerfile: ./backend/books_service/Dockerfile
    ports:
      - "5001:5000"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: libsys
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - libsys

  readers-service:
    build:
      context: .
      dockerfile: ./backend/readers_service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: libsys
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "5002:5000"
    restart: always
    networks:
      - libsys

  loans-service:
    build:
      context: .
      dockerfile: ./backend/loans_service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: libsys
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "5004:5000"
    restart: always
    networks:
      - libsys

  monitor-service:
    build:
      context: .
      dockerfile: ./backend/monitor_service/Dockerfile
    ports:
      - "5000:5000"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: libsys
      DB_USER: postgres
      DB_PASSWORD: postgres
      BOOKS_SERVICE_API_URL: http://books-service:5000
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - libsys

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      BOOKS_SERVICE_API_URL: http://books-service:5000
      READERS_SERVICE_API_URL: http://readers-service:5000
      LOANS_SERVICE_API_URL: http://loans-service:5000
      MONITOR_SERVICE_API_URL: http://monitor-service:5000
    depends_on:
      - monitor-service
    restart: always
    networks:
      - libsys

volumes:
  postgres_data:

networks:
  libsys:
